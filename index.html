<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <h1>Study Tracker V1</h1>
  </header>

  <main class="container">

    <section class="dashboard-section">
      <h2>Dashboard</h2>

      <div class="dashboard-summary">
        <div class="stat-card">
          <span class="stat-value" id="stat-total-units">0</span>
          <span class="stat-label">Units</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-total-subtopics-done">0/0</span>
          <span class="stat-label">Subtopics Done</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-total-sessions">0</span>
          <span class="stat-label">Sessions Logged</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-total-time">0</span>
          <span class="stat-label">Minutes Studied</span>
        </div>
      </div>

      <div id="dashboard-per-unit" class="dashboard-per-unit"></div>
    </section>

    <section class="unit-form-section">
      <h2>Add a Unit</h2>
      <form id="unit-form">
        <input type="hidden" id="unit-id" />

        <label for="unit-name">Unit Name</label>
        <input type="text" id="unit-name" placeholder="e.g. ICS 4111 - Embedded Systems" required />

        <label for="unit-exam-date">Exam Date</label>
        <input type="date" id="unit-exam-date" required />

        <label for="unit-priority">Priority</label>
        <select id="unit-priority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>

        <button type="submit" id="unit-submit-btn">Add Unit</button>
        <button type="button" id="unit-cancel-btn" style="display: none;">Cancel Edit</button>
      </form>
    </section>

    <section class="unit-list-section">
      <h2>Your Units</h2>

      <label for="unit-sort">Sort by</label>
      <select id="unit-sort">
        <option value="examDate">Exam Date (soonest first)</option>
        <option value="priority">Priority (high first)</option>
      </select>

      <div id="unit-list" class="unit-list">
        <p class="empty-state" id="empty-state">No units yet. Add one above to get started.</p>
      </div>
    </section>

    <section class="subtopic-section">
      <h2>Subtopics</h2>

      <label for="subtopic-unit-select">Select a Unit</label>
      <select id="subtopic-unit-select">
        <option value="">-- Choose a unit --</option>
      </select>

      <label for="subtopic-status-filter">Filter by status</label>
      <select id="subtopic-status-filter">
        <option value="all">All</option>
        <option value="not-started">Not Started</option>
        <option value="in-progress">In Progress</option>
        <option value="done">Done</option>
      </select>

      <form id="subtopic-form" style="display: none;">
        <input type="hidden" id="subtopic-id" />
        <input type="hidden" id="subtopic-unit-id" />

        <label for="subtopic-name">Subtopic Name</label>
        <input type="text" id="subtopic-name" placeholder="e.g. MQTT" required />

        <label for="subtopic-status">Status</label>
        <select id="subtopic-status">
          <option value="not-started" selected>Not Started</option>
          <option value="in-progress">In Progress</option>
          <option value="done">Done</option>
        </select>

        <label for="subtopic-target-date">Target Date (optional)</label>
        <input type="date" id="subtopic-target-date" />

        <button type="submit" id="subtopic-submit-btn">Add Subtopic</button>
        <button type="button" id="subtopic-cancel-btn" style="display: none;">Cancel Edit</button>
      </form>

      <div id="subtopic-list" class="subtopic-list"></div>
    </section>

    <section class="session-section">
      <h2>Study Sessions</h2>

      <label for="session-subtopic-select">Select a Subtopic</label>
      <select id="session-subtopic-select">
        <option value="">-- Choose a subtopic --</option>
      </select>

      <form id="session-form" style="display: none;" enctype="multipart/form-data">
        <input type="hidden" id="session-id" />
        <input type="hidden" id="session-subtopic-id" />

        <label for="session-date">Date</label>
        <input type="date" id="session-date" required />

        <label for="session-duration">Duration (minutes)</label>
        <input type="number" id="session-duration" min="1" required />

        <label for="session-summary">Summary</label>
        <textarea id="session-summary" rows="3" placeholder="What did you study?"></textarea>

        <label for="session-attachment">Attachment (image or PDF, optional)</label>
        <input type="file" id="session-attachment" accept="image/*,application/pdf" />
        <p id="session-attachment-error" class="error-text" style="display: none;"></p>
        <p id="session-existing-attachment" class="existing-attachment"></p>

        <button type="submit" id="session-submit-btn">Add Session</button>
        <button type="button" id="session-cancel-btn" style="display: none;">Cancel Edit</button>
      </form>

      <div id="session-list" class="session-list"></div>
    </section>

  </main>

  <script src="js/db.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/units.js"></script>
  <script src="js/subtopics.js"></script>
  <script src="js/sessions.js"></script>
</body>
</html>
